# Render's free tier puts the API to sleep after ~15 minutes without traffic,
# which makes the first visit slow. Pinging the health check every 10 minutes
# keeps it awake. GitHub may delay scheduled runs by a few minutes at busy
# times; the frontend also handles a sleeping server (client/src/services/serverWake.js).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        run: >
          curl --fail --silent --show-error
          --retry 3 --retry-delay 20 --retry-all-errors
          --max-time 90
          https://profligate-api.onrender.com/api/v1/healthcheck
